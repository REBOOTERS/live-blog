name: Deploy to GitHub Pages

# 只在推送 v 开头的 tag（如 v1.0.0）时触发部署，避免每次 push 都构建。
# 触发命令：git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 也允许在 Actions 页面手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 注入 Pages 子路径作为 Vite 的 base，对应 https://rebooters.github.io/live-blog/
      - run: PAGES_BASE=/live-blog/ npm run build
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/pages")

          if [ "$status" = '200' ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          elif [ "$status" = '404' ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'GitHub Pages is not enabled for this repository yet; skipping deployment steps.' >> "$GITHUB_STEP_SUMMARY"
          else
            cat /tmp/pages.json
            echo "::error::Failed to read GitHub Pages configuration (HTTP $status)."
            exit 1
          fi
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
